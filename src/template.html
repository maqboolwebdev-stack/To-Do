<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do</title>
    <link rel="shortcut icon" href="../src/images/favicon.svg" type="image/x-icon">
  </head>
  <body>
    <div class="main">
      <div class="control-side">
        <div class="logo-container">
          <img class="logo-image" src="../src/images/logo.svg" alt="To-Do" />
        </div>
        <div class="add-btns-container">
          <button class="project-btn" id="project-add-btn">Add project</button>
          <button class="todo-btn">Add To Do</button>
        </div>

        <h1 class="projects-heading">Projects</h1>
        <div class="projects">
          <!-- dynamic projects will be generated by js -->
        </div>
      </div>

      <div class="todos-side">
        <!-- dynamic todos will be generated by js -->
      </div>
    </div>
  </body>
</html>
