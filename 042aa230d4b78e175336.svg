<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Todo App Logo">
  <!-- App Icon Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="rgb(0, 255, 0)" />
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#0F172A" stroke-opacity="0.15" stroke-width="2" />

  <!-- Row 1: Completed Task -->
  <rect x="26" y="28" width="32" height="32" rx="9" fill="#0F172A" />
  <path d="M34.5 44.5 L40 50 L50.5 38.5" fill="none" stroke="rgb(0, 255, 0)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="68" y="38" width="34" height="12" rx="6" fill="#0F172A" fill-opacity="0.95" />

  <!-- Row 2: Pending Task -->
  <rect x="28" y="70" width="28" height="28" rx="7.5" fill="none" stroke="#0F172A" stroke-width="4" stroke-opacity="0.85" />
  <rect x="68" y="78" width="26" height="12" rx="6" fill="#0F172A" fill-opacity="0.65" />
